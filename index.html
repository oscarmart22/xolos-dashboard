<style>
/* Layout: sidebar oscuro a la izquierda, barra superior con rango, rejilla de paneles tipo tablero (boceto Figura 1) */
:root{
  --bg:#f4f2f1; --panel:#fdfcfc; --line:#e6e1e0; --fg:#1e1a1a; --muted:#6d6564;
  --side:#161111; --side-fg:#eee8e7; --side-active:#8c1d25; --side-active-fg:#fff;
  --bar:#d2c8c7; --bar-hi:#b4a6a5; --ink-line:#2a2424;
  --good:#1f8a57; --warn:#e8a21c; --bad:#d92d20; --good-bg:#e3f1e8; --accent-d:#a81f29;
  --grid:#eae5e4; --band:#e9e4e3; --orange:#e9822b;
  --avatar:linear-gradient(145deg,#a81f29,#1a1112);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Fraunces",Georgia,serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141010; --panel:#1d1818; --line:#322b2b; --fg:#f0eae9; --muted:#a39a99;
  --side:#0d0a0a; --side-fg:#e9e2e1; --side-active:#6e1a21; --side-active-fg:#fff;
  --bar:#5a4e4e; --bar-hi:#7a6b6b; --ink-line:#f0eae9;
  --good:#3dbb82; --warn:#f0b341; --bad:#f0584c; --good-bg:#1f3a2d; --accent-d:#ee5a60;
  --grid:#2e2727; --band:#2f2828; --orange:#f09a45;
  --avatar:linear-gradient(145deg,#8c1d25,#0d0a0a); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141010; --panel:#1d1818; --line:#322b2b; --fg:#f0eae9; --muted:#a39a99;
  --side:#0d0a0a; --side-fg:#e9e2e1; --side-active:#6e1a21; --side-active-fg:#fff;
  --bar:#5a4e4e; --bar-hi:#7a6b6b; --ink-line:#f0eae9;
  --good:#3dbb82; --warn:#f0b341; --bad:#f0584c; --good-bg:#1f3a2d; --accent-d:#ee5a60;
  --grid:#2e2727; --band:#2f2828; --orange:#f09a45;
  --avatar:linear-gradient(145deg,#8c1d25,#0d0a0a); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.4}
button,select{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-fg);padding:0 0 24px;position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column}
.brand{display:flex;gap:12px;align-items:center;padding:18px 18px;background:rgba(0,0,0,.18)}
.crest{width:44px;height:44px;border-radius:50%;background:#c8202b;display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:20px;color:#fff;border:2px solid #f1ebe2;flex:none}
.brand b{font-family:var(--serif);font-size:20px;font-weight:600;display:block;line-height:1.1}
.brand span{font-size:12px;opacity:.8}
.nav{display:flex;flex-direction:column;gap:4px;padding:14px 12px}
.nav button{background:none;border:0;text-align:left;padding:10px 12px;border-radius:8px;display:flex;gap:12px;align-items:center;cursor:pointer;color:var(--side-fg);opacity:.9;font-size:15px}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:var(--side-active);color:var(--side-active-fg);opacity:1;font-weight:500}
.nav svg{width:18px;height:18px;flex:none}
.main{min-width:0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.pill{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 12px;font-size:13px}
.top select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;cursor:pointer}
.sp{flex:1}
.demo{display:inline-flex;gap:6px;align-items:center;border-radius:8px;padding:8px 12px;background:var(--bg);border:1px solid var(--line);font-size:13px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center}
.content{padding:20px 24px 40px;display:flex;flex-direction:column;gap:16px}
.back{color:var(--muted);background:none;border:0;cursor:pointer;padding:0;text-align:left;font-size:14px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.who{display:flex;gap:18px;align-items:center;min-width:0}
.avatar{width:88px;height:88px;border-radius:50%;background:var(--avatar);display:grid;place-items:center;font-family:var(--serif);font-size:32px;color:#f6efe4;flex:none}
.who h1{font-family:var(--serif);font-weight:500;font-size:28px;margin:0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--font);font-size:12px;background:var(--line);border-radius:999px;padding:2px 9px;color:var(--muted)}
.chips{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:8px;padding:3px 12px;font-size:13px;background:var(--bg)}
.chip.on{background:var(--good-bg);color:var(--good);border-color:transparent}
.meta{color:var(--muted);font-size:13px}
.statuses{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;box-shadow:0 1px 3px rgba(60,40,20,.06)}
.card small{color:var(--muted);font-size:12px;display:block}
.card .big{font-size:24px;font-weight:600;margin:4px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 18px;cursor:pointer;color:var(--muted);white-space:nowrap;font-size:14px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent-d);font-weight:500}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,minmax(0,1fr))}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0;box-shadow:0 1px 3px rgba(60,40,20,.06)}
.panel h2{font-size:16px;font-weight:600;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c5{grid-column:span 5}.c3{grid-column:span 3}
.c12{grid-column:span 12}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.legend i{display:inline-block;vertical-align:middle;margin-right:6px}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
svg text{fill:var(--muted);font-family:var(--font);font-size:11px}
.heatwrap{display:flex;flex-direction:column;gap:12px}
.panel.pc{display:flex;flex-direction:column}
.panel.pc>.chart.fill,.panel.pc>.heatwrap{flex:1}
.chart.fill{position:relative}
.chart.fill svg{position:absolute;inset:0;width:100%;height:100%}
.heatwrap .fillbox{flex:1}.heatwrap .mini{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.heatwrap .mini div{white-space:normal;font-size:12.5px;padding:8px 10px;flex-wrap:wrap}.heatwrap .mini div{border-bottom:1px solid var(--line)}.heatwrap .mini div:nth-child(odd){border-right:1px solid var(--line)}.heatwrap .mini div:nth-last-child(-n+2){border-bottom:0}
.fillbox{position:relative;min-height:170px}
.fillbox canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:4px;display:block}
.mini{display:grid;gap:0;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.mini div{display:flex;justify-content:space-between;gap:8px;padding:9px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.mini div:last-child{border:0}.mini div{white-space:nowrap}.mini b{font-variant-numeric:tabular-nums}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13px}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-size:12px}
.pos{color:var(--good)}.neg{color:var(--bad)}.mid{color:var(--orange)}
.scroll{overflow-x:auto}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dtab th,.dtab td{text-align:left}.dtab td:last-child{vertical-align:middle}
.ci{margin-left:8px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--accent-d);background:none;color:var(--accent-d);font:italic 600 12px var(--serif);cursor:pointer;vertical-align:middle;padding:0}.ci[aria-expanded="true"]{background:var(--accent-d);color:var(--panel)}.panel{position:relative}.cinote{position:absolute;left:16px;right:16px;z-index:8;margin:0;font-size:13px;line-height:1.4;color:var(--fg);background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.18);border-radius:8px;padding:8px 10px}.chart svg [tabindex]:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.ptb th:nth-child(2),.ptb td:nth-child(2),.pos3 th:nth-child(2),.pos3 td:nth-child(2),.pos3 th:nth-child(3),.pos3 td:nth-child(3){text-align:left}.rowbtn td:last-child{white-space:nowrap}
.mlist{margin:0;padding-left:18px;display:grid;gap:8px;font-size:14px;line-height:1.5}.mlist li::marker{color:var(--accent-d)}
.mt p{margin:0 0 10px;font-size:14px;line-height:1.55}.mt p:last-child{margin-bottom:0}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent-d)}
.btn.link{border:0;background:none;padding:6px}
.tip{position:fixed;pointer-events:none;background:var(--fg);color:var(--bg);padding:6px 10px;border-radius:6px;font-size:12px;z-index:50;display:none;max-width:220px}
.rowbtn{cursor:pointer}
.rowbtn:hover rect.bar{opacity:.85}
a,button:focus-visible,select:focus-visible{outline:2px solid var(--accent-d);outline-offset:2px}
.tx{columns:3 300px;column-gap:32px;line-height:1.6}.tx h2{column-span:all}.tx p{break-inside:avoid;margin:0 0 12px}
.tx h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:4px 0 8px}
.kpis{display:flex;flex-wrap:wrap;gap:12px}.kpis .card{flex:1 1 170px;min-width:0}.kpis.k6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:1180px){.kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}}@media (max-width:560px){.kpis.k6{grid-template-columns:repeat(2,minmax(0,1fr))}.fbar{grid-template-columns:1fr}.fbar .span2{grid-column:auto}}
.kpis .card b{font-size:22px;display:block;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap}.kpis .card b small.u{display:inline;font-size:13px;font-weight:400;color:var(--muted)}.kpis.k6 .card{display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.sel{display:flex;gap:8px;flex-wrap:wrap}
.guide{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.ibtn{display:inline-flex;gap:10px;align-items:center;background:none;border:0;cursor:pointer;padding:4px 2px;font-size:14px;font-weight:500}
.ibtn .i{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--accent-d);color:var(--accent-d);display:grid;place-items:center;font-family:var(--serif);font-style:italic;font-weight:600;font-size:14px}
.ibtn[aria-expanded="true"] .i{background:var(--accent-d);color:var(--panel)}
.guide ul{margin:10px 0 4px;padding-left:20px;display:grid;gap:5px;font-size:13px;color:var(--muted)}
.guide li b{color:var(--fg);font-weight:600}
.guide .note{margin:8px 0 2px;font-size:12px;color:var(--muted)}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:baseline}
.ptitle{font-family:var(--serif);font-weight:500;font-size:28px;margin:0}
.fbar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 24px;align-items:end;padding:14px 16px}.fbar .span2{grid-column:span 2}
.fbar .fld select,.fbar .fld input{width:100%;min-width:0}
#tab-out .tabs{margin-bottom:-4px}
.kcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 36px}
.kcol h3{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.kcol h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--bar-hi)}
.kcol.b-mov h3::before{background:var(--accent-d)}
.kr{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)}
.kcol .kr:last-child{border-bottom:0}
.kcol{display:flex;flex-direction:column}
.kmini{margin-top:auto;padding-top:14px}
.kmini .cap{font-size:12px;color:var(--muted);margin-bottom:2px}
.panel.kcol .kmini{margin-top:0;padding-top:0}
.kcode{font-size:11px;font-weight:600;color:var(--muted);min-width:26px}
.kname{font-size:13.5px}
.kval{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.kval .u{font-size:12px;font-weight:400;color:var(--muted)}
.c7{grid-column:span 7}
.panel h2 .meta{white-space:nowrap}
.cnote{margin:8px 0 0;font-size:12px;color:var(--muted)}
@media (max-width:1000px){.c7{grid-column:span 12}}
.tlayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.filters{position:sticky;top:76px;display:flex;flex-direction:column;gap:16px}
.filters h2{margin:0;font-size:16px}
.fld{display:flex;flex-direction:column;gap:6px}.fld label,.fld .lb{font-size:12px;color:var(--muted);font-weight:500}
.fld select,.fld input{width:100%}
.fld input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px;font:inherit;color:inherit}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px}
.seg button:hover{border-color:var(--accent-d)}
.seg button[aria-pressed="true"]{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
.tcontent{display:flex;flex-direction:column;gap:16px;min-width:0}
#tab-out{display:flex;flex-direction:column;gap:16px}
.kgroups{display:flex;flex-direction:column;gap:16px}
.kblock{display:flex;flex-direction:column;gap:8px}
.kblock h3{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.kblock h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--bar-hi)}
.kblock.b-mov h3::before{background:var(--accent-d)}
.krow{display:flex;gap:12px;flex-wrap:wrap}
.kpi{flex:1 1 190px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;box-shadow:0 1px 3px rgba(60,40,20,.06)}
.kc{font-size:12px;color:var(--muted);line-height:1.3}.kc b{color:var(--fg);margin-right:6px}
.kvv{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.15}
.kvv .u{font-size:12px;font-weight:400;color:var(--muted)}
.kd{font-size:12px;color:var(--muted);line-height:1.35;margin-top:auto}
.obs th:nth-child(2),.obs td:nth-child(2){text-align:left}
.nd{font-size:14px;font-weight:400;color:var(--muted)}
@media (max-width:1000px){.tlayout{grid-template-columns:1fr}.filters{position:static}.kpi{flex:1 1 150px}}
.hidden-tab{display:none!important}
@media (max-width:1000px){.c8,.c4,.c6,.c5,.c3{grid-column:span 12}.hero{grid-template-columns:1fr}.heatwrap{grid-template-columns:1fr}}
@media (max-width:760px){
  .top{position:static;gap:6px 8px;padding-top:10px;padding-bottom:10px}.top .sp{display:none}.top select,.top .pill,.top .demo{font-size:12px;padding:5px 9px}
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;overflow-x:auto;padding:0}
  .brand{padding:10px 12px;flex:none}.brand span{display:none}
  .nav{flex-direction:row;padding:6px}.nav button{white-space:nowrap;padding:8px 10px}
  .top,.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .statuses{grid-template-columns:1fr}
  .avatar{width:64px;height:64px;font-size:22px}
}
/* animaciones */
:root{--ease:cubic-bezier(.22,.61,.36,1)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes tipIn{from{opacity:0;transform:translateY(-4px)}}
@keyframes pop{0%{transform:scale(.6) rotate(-12deg);opacity:.2}60%{transform:scale(1.18)}100%{transform:none;opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(200,50,50,.45)}60%{box-shadow:0 0 0 6px rgba(200,50,50,0)}}
#view.enter>*{animation:rise .5s var(--ease) backwards;animation-delay:calc(var(--i,0)*55ms)}
#tab-out.fx>*{animation:fadeIn .35s var(--ease) backwards}
.btn,.pill,.seg button,.tabs button,.iconbtn,.nav button,.ibtn,.ci,select,input{transition:background-color .2s var(--ease),border-color .2s var(--ease),color .2s var(--ease),box-shadow .2s var(--ease),transform .15s var(--ease),opacity .2s}
.btn:active,.seg button:active,.iconbtn:active,.nav button:active{transform:scale(.96)}
.btn:hover,.iconbtn:hover{border-color:var(--accent-d)}.iconbtn:hover{transform:rotate(12deg)}.iconbtn:active{transform:scale(.92)}
.nav svg{transition:transform .25s var(--ease)}.nav button:hover svg{transform:translateX(2px) scale(1.12)}
.nav button[aria-current="page"]{animation:fadeIn .35s var(--ease)}.nav button[aria-current="page"] svg{animation:pop .5s var(--ease)}
.kpi,.kcol,.card,.panel{transition:box-shadow .25s var(--ease),border-color .25s var(--ease),transform .25s var(--ease)}
.kpi:hover,.kpis .card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(60,40,20,.10)}
.panel:hover{box-shadow:0 4px 14px rgba(60,40,20,.09)}
tr.rowbtn td,.kr{transition:background-color .15s var(--ease)}tr.rowbtn:hover td{background:var(--band)}
.ci:hover{transform:scale(1.15)}.ibtn:hover .i{transform:scale(1.12)}.ibtn .i{transition:transform .2s var(--ease),background-color .2s,color .2s}
.cinote:not([hidden]){animation:tipIn .18s var(--ease)}
.guide #gbody:not([hidden]){animation:rise .3s var(--ease)}
#tip{animation:tipIn .12s var(--ease)}
canvas{animation:fadeIn .7s var(--ease)}
.chart svg [data-tip]{transition:opacity .15s,filter .15s}.chart svg circle[data-tip]:hover{filter:brightness(1.15)}
.rowbtn:hover rect.bar,.chart rect.bar:hover{opacity:.85}
details summary{transition:color .2s}details[open]>summary~*{animation:fadeIn .3s var(--ease)}
.dot[style*="--bad"]{animation:pulse 2.4s ease-out infinite}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

</style>

    if(miss.length)throw new Error("faltan columnas obligatorias: "+miss.join(", "));

   ["K7 · Variación semanal de carga","(Distancia de la semana n − semana n−1) ÷ semana n−1 × 100 (%).","distancia_total_m, semana","Detectar aumentos bruscos y moderarlos en la planeación de la siguiente semana."],
   ["K8 · Asimetría media de rodilla","Promedio de asim_rodilla_pct (%).","ang_rodilla_izq, ang_rodilla_der","Identificar jugadores para comentar con el cuerpo médico (señal asociada, no diagnóstico)."],
   ["K9 · Jugadores sobre el umbral de asimetría","Conteo de jugadores con asimetría media mayor al umbral (n).","asim_rodilla_pct, umbral","Priorizar a qué jugadores observar más de cerca."],
   ["K10 · Confiabilidad de captura","Promedio de confianza_pose (0 a 1).","confianza_pose","Decidir si los datos de movimiento son confiables o hay que repetir la captura."]];
  var gr=[["① Barras: distancia a alta intensidad por jugador","K2","Compara de inmediato a un jugador con los demás."],["② Líneas: distancia por sesión y variación semanal","K1, K7","Muestra la tendencia de la carga y los saltos entre semanas."],["③ Barras agrupadas: aceleraciones y desaceleraciones por tipo de sesión","K3, K4","Compara qué tipos de entrenamiento exigen más arranques y frenados."],["④ Histograma: distribución de la asimetría de rodilla","K8, K9","Muestra cuántos jugadores se alejan del resto y dónde cae el umbral."],["⑤ Tabla de jugadores en observación","K8, K9","Semáforo según el umbral editable."]];
  var T=function(h,rows,cls){return '<div class="scroll"><table class="dtab '+(cls||'')+'"><thead><tr>'+h.map(function(x){return '<th>'+x+'</th>'}).join("")+'</tr></thead><tbody>'+rows.map(function(r){return '<tr>'+r.map(function(c,k){return '<td'+(k===0?' style="font-weight:500"':'')+'>'+c+'</td>'}).join("")+'</tr>'}).join("")+'</tbody></table></div>'};
  return '<div><h1 class="ptitle">Metodología</h1><p class="meta" style="margin:4px 0 0">Propuesta de dashboard para la visualización del rendimiento físico y el monitoreo de factores de riesgo de lesión · Club Tijuana (Xolos)</p></div>'+
  '<div class="grid">'+
  '<section class="panel c6 mt"><h2>Objetivo y enfoque</h2><p>Visualizar de forma integrada indicadores de rendimiento físico y de monitoreo de factores asociados al riesgo de lesión, para apoyar al preparador físico en la toma de decisiones sobre la carga y la planificación del entrenamiento.</p><p>El enfoque es <b>descriptivo</b>: muestra cómo se comportan la carga y el movimiento por jugador, sesión y semana, pero no explica las causas de una lesión ni calcula su probabilidad. Los indicadores de movimiento son <b>factores asociados</b>, no predictores. La herramienta orienta la revisión; la decisión final es del cuerpo técnico.</p><p>Decisiones que apoya: cuánta carga programar en la siguiente sesión o semana; qué jugadores revisar porque su carga se acumuló o cambió bruscamente; y qué jugadores muestran una asimetría que valga la pena comentar con el cuerpo médico.</p></section>'+
  '<section class="panel c6 mt"><h2>Datos de esta demostración</h2><p>Los valores de carga y de movimiento son <b>simulados</b>: no son mediciones de jugadores reales y no deben leerse como una evaluación de su rendimiento, carga o riesgo. Lo que se demuestra es la lógica del tablero: cómo se calculan los indicadores, cómo se filtran y cómo se leen.</p><p>Periodo: '+per+' (4 semanas, 4 sesiones por semana), con '+R.players+' jugadores y '+R.sessions+' sesiones: '+R.valid+' registros, donde cada registro es un jugador en una sesión. Los 28 días previos solo se usan para calcular el ACWR.</p><p>Los nombres, dorsales, posiciones y fechas de nacimiento provienen de la página pública del primer equipo (xolos.com.mx); las métricas no tienen relación con esas personas.</p><p>Un CSV propio con la estructura del diccionario sustituye a la demostración sin cambiar el tablero.</p></section>'+
  '<section class="panel c6 mt"><h2>Limpieza y validación</h2><ul class="mlist"><li>Cada combinación id_jugador + id_sesion aparece una sola vez; los duplicados se eliminan conservando el primero.</li><li>Las fechas se homologan a AAAA-MM-DD; la semana se recalcula desde la fecha.</li><li><b>Los faltantes no se imputan</b>: se marcan «sin dato», se registran en la bitácora y el registro se excluye solo de los KPI que usan esa variable.</li><li>Los valores fuera de rango se revisan uno por uno: se corrigen si son un error de captura y se conservan con una nota si son plausibles.</li><li>Los atípicos plausibles se conservan: un pico de carga puede ser justo lo que el tablero debe mostrar.</li><li>Validaciones: conteo de registros, rangos del diccionario, coherencia interna (alta intensidad ≤ total, velocidad promedio ≤ máxima, distancia ÷ duración dentro de ±10 % de la velocidad promedio) y totales recalculados de forma independiente.</li></ul></section>'+
  '<section class="panel c6 mt"><h2>Definiciones</h2><ul class="mlist"><li><b>ACWR.</b> Carga media de los últimos 7 días ÷ carga media de los últimos 28 días. Rango óptimo 0.8–1.3; rojo por encima de 1.5 y ámbar entre 1.1 y 1.5.</li><li><b>Asimetría de rodilla.</b> 100 × |izq − der| ÷ promedio de ambas. Con confianza de pose menor a 0.5 el registro no entra en K8 ni K9.</li><li><b>Umbral de asimetría.</b> Lo define el preparador físico (se edita en Tablero y aplica a todas las pantallas): rojo sobre el umbral y ámbar entre el 80 % y el 100 %.</li><li><b>Estado.</b> Rojo si el ACWR supera 1.5 o la asimetría el umbral; ámbar si el ACWR supera 1.1 o la asimetría el 80 % del umbral.</li><li><b>Periodo.</b> Todas las pantallas usan las mismas definiciones; el selector de fechas acota Resumen, Equipo, Vista de jugador y Comparar, y el Tablero usa siempre las 4 semanas.</li></ul></section>'+
  '<section class="panel c12"><h2>Indicadores (KPI)</h2>'+T(["KPI","Fórmula / unidad","Variables","Decisión que apoya"],kp)+'<p class="meta" style="margin:10px 0 0">Los 10 KPI se agrupan en tres bloques: carga (K1, K6, K7), intensidad (K2 a K5) y movimiento (K8 a K10). Las fórmulas se aplican sobre el periodo y los filtros seleccionados.</p></section>'+
  '<section class="panel c7"><h2>Visualizaciones</h2>'+T(["Gráfico","KPI","Qué muestra"],gr)+'<p class="meta" style="margin:10px 0 0">Segmentadores: jugador, semana o sesión, y tipo de entrenamiento. Afectan a todas las tarjetas, los gráficos y la tabla de jugadores en observación.</p></section>'+
  '<section class="panel c5 mt"><h2>Del documento al tablero</h2>'+T(["Hoja del trabajo","Pestaña aquí"],[["Datos","Datos (fuente, validaciones, bitácora)"],["Diccionario","Datos → Diccionario de datos"],["Cálculos y Dashboard","Tablero"],["Interpretación","«Cómo leer esta pantalla» y los botones «i»"],["Bitácora y Validaciones","Datos"]])+'<p class="meta" style="margin:10px 0 0">Este tablero es la versión web interactiva del diseño propuesto en el trabajo, que contempla Excel como herramienta de construcción.</p></section>'+

var TIPOS=["Táctica","Física","Juego reducido","Recuperación"];
function tabRecs(ignoreWeek,weekOverride,o){
  var f=state.tf,out=[];
  P.forEach(function(p){if(!(o&&o.noPid)&&f.pid!=="all"&&p.id!==+f.pid)return;
    for(var i=WARM;i<WARM+28;i++){var r=p.rec[i];if(r.rest)continue;
      if(weekOverride){if(r.week!==weekOverride)continue}else if(!ignoreWeek&&f.week&&r.week!==f.week)continue;
      if(!weekOverride&&!ignoreWeek&&f.ses!=="all"&&i!==+f.ses)continue;
      if(!(o&&o.noTipo)&&f.tipo!=="all"&&r.tipo!==f.tipo)continue;out.push({p:p,i:i,r:r})}});
  return out;
}
function sum(a,fn){return a.reduce(function(t,x){var v=fn(x);return t+(v===null||v===undefined?0:v)},0)}
var cntN=function(a,fn){return a.filter(function(x){var v=fn(x);return v!==null&&v!==undefined}).length};
function tabKpis(){
  var rc=tabRecs(),n=rc.length,u=state.umbral;
  var K={n:n};
  K.k1=cntN(rc,function(x){return x.r.dist})?mean(rc.map(function(x){return x.r.dist})):null;
  K.k2=cntN(rc,function(x){return x.r.hi})?sum(rc,function(x){return x.r.hi}):null;
  K.k3=cntN(rc,function(x){return x.r.acel})?sum(rc,function(x){return x.r.acel}):null;
  K.k4=cntN(rc,function(x){return x.r.desa})?sum(rc,function(x){return x.r.desa}):null;
  K.k5=mxN(rc.map(function(x){return x.r.vmax}));
  var pr=rc.filter(function(x){return x.r.dist!==null&&x.r.load}),pl=sum(pr,function(x){return x.r.load});K.k6=pl?sum(pr,function(x){return x.r.dist})/pl:null;
  var cur=state.tf.week||(state.tf.ses!=="all"?P[0].rec[+state.tf.ses].week:4),prev=cur-1;K.wk=cur;K.k7=null;
  if(prev>=1){var a=sum(tabRecs(true,cur),function(x){return x.r.dist}),b=sum(tabRecs(true,prev),function(x){return x.r.dist});if(b>0)K.k7=(a-b)/b*100}
  var ok=rc.filter(function(x){return x.r.conf>=.5&&x.r.asym!==null});K.nok=ok.length;K.low=n-ok.length;
  K.k8=ok.length?mean(ok.map(function(x){return x.r.asym})):null;
  var by={};ok.forEach(function(x){(by[x.p.id]=by[x.p.id]||[]).push(x.r.asym)});
  K.byPlayer=by;K.k9=Object.keys(by).filter(function(id){return mean(by[id])>u}).length;
  K.k10=cntN(rc,function(x){return x.r.conf})?mean(rc.map(function(x){return x.r.conf})):null;
  return K;
}
function kv(v,d,suf){return v===null||v===undefined?'<span class="nd">sin dato</span>':fmt(v,d)+(suf?'<small class="u"> '+suf+'</small>':'')}
function kpiGroups(K){
  var wk=K.wk,k7=K.k7===null?'<span class="nd">n/d</span>':'<span class="'+(K.k7>15?'neg':K.k7>8?'mid':'pos')+'">'+(K.k7>=0?'+':'−')+Math.abs(K.k7).toFixed(1)+'%</span>';
  var I=function(code,name,val,desc){return {code:code,name:name,val:val,desc:desc}};
  return [
   {id:"Carga",cls:"b-carga",items:[I('K1','Distancia total por sesión',kv(K.k1,0,'m'),'Ajustar el volumen de la siguiente sesión.'),I('K6','Carga por minuto',kv(K.k6,1,'m/min'),'Comparar sesiones de distinta duración y tipo.'),I('K7','Variación semanal de carga',k7,'Detectar aumentos bruscos y moderarlos en la planeación de la siguiente semana.'+(K.k7===null?' Elige una semana 2 a 4, una sesión o «Todas».':' (Semana '+wk+' vs. semana '+(wk-1)+')'))]},
   {id:"Intensidad",cls:"b-int",items:[I('K2','Distancia a alta intensidad',kv(K.k2,0,'m'),'Decidir cuánto trabajo de alta velocidad programar y a quién reducirlo.'),I('K3','Aceleraciones de alta intensidad',kv(K.k3,0),'Regular los ejercicios de arranque y cambio de ritmo.'),I('K4','Desaceleraciones de alta intensidad',kv(K.k4,0),'Regular los ejercicios de frenado y cambio de dirección.'),I('K5','Velocidad máxima',kv(K.k5,1,'km/h'),'Verificar si se alcanzaron velocidades máximas y planear el trabajo de velocidad.')]},
   {id:"Movimiento",cls:"b-mov",items:[I('K8','Asimetría media de rodilla',kv(K.k8,1,'%'),'Identificar jugadores para comentar con el cuerpo médico (señal asociada, no diagnóstico).'),I('K9','Jugadores sobre el umbral de asimetría',K.k8===null?'<span class="nd">sin dato</span>':String(K.k9)+'<small class="u"> de '+Object.keys(K.byPlayer).length+'</small>','Priorizar a qué jugadores observar más de cerca. Umbral actual: '+fmt(state.umbral,1)+'%.'),I('K10','Confiabilidad de captura',K.k10===null?'<span class="nd">sin dato</span>':K.k10.toFixed(2),'Decidir si los datos de movimiento son confiables o hay que repetir la captura.'+(K.low?' '+K.low+' registro(s) con confianza bajo 0.5 o sin dato quedan fuera de K8 y K9.':' Todos los registros tienen confianza suficiente.'))]}
  ];
}
function kpiPanel(K){
  var G=kpiGroups(K),t=state.ttab;
  if(t!=="Todos"){var g=G.filter(function(x){return x.id===t})[0];
    return '<div class="krow">'+g.items.map(function(i){return '<div class="kpi"><div class="kc"><b>'+i.code+'</b>'+i.name+'</div><div class="kvv">'+i.val+'</div><div class="kd">'+i.desc+'</div></div>'}).join("")+'</div>'+tabCharts(g.id)}
  return '<section class="panel"><div class="kcols">'+G.map(function(g){return '<div class="kcol '+g.cls+'"><h3>'+g.id+'</h3>'+g.items.map(function(i){return '<div class="kr" title="'+i.desc+'"><span class="kcode">'+i.code+'</span><span class="kname">'+i.name+'</span><span class="kval">'+i.val+'</span></div>'}).join("")+miniHost(g.id,92)+'</div>'}).join("")+'</div></section>';

function obsTable(K){
  var u=state.umbral,rc=tabRecs(),by={};
  rc.forEach(function(x){var o=by[x.p.id]=by[x.p.id]||{p:x.p,n:0,hi:0,as:[],cf:[]};o.n++;o.hi+=x.r.hi||0;o.cf.push(x.r.conf);if(x.r.conf>=.5&&x.r.asym!==null)o.as.push(x.r.asym)});
  var L=Object.keys(by).map(function(k){var o=by[k];o.asm=o.as.length?mean(o.as):null;o.cfm=o.cf.some(function(v){return v!==null})?mean(o.cf):null;return o});
  var est=function(o){if(o.asm===null)return {c:"--muted",t:"Sin dato",o:3};return o.asm>u?{c:"--bad",t:"Revisar",o:0}:o.asm>u*.8?{c:"--warn",t:"Vigilar",o:1}:{c:"--good",t:"Normal",o:2}};
  L.sort(function(a,b){var ea=est(a),eb=est(b);return ea.o-eb.o||(b.asm||0)-(a.asm||0)});
  var shown=L.filter(function(o){return est(o).o<2||state.tf.pid!=="all"});
  if(!shown.length)return '<p class="meta">Ningún jugador supera el 80% del umbral con los filtros actuales.</p>';
  return '<div class="scroll"><table class="obs"><thead><tr><th>Jugador</th><th>Pos.</th><th>Sesiones</th><th>Dist. alta int. (m)</th><th>Asim. media (%)</th><th>Confianza</th><th>Estado (asimetría)</th></tr></thead><tbody>'+
   shown.map(function(o){var e=est(o);return '<tr class="rowbtn" data-pid="'+o.p.id+'"><td>'+o.p.name+'</td><td>'+o.p.pos+'</td><td>'+o.n+'</td><td>'+fmt(o.hi)+'</td><td>'+(o.asm===null?'<span class="nd">sin dato</span>':o.asm.toFixed(1))+'</td><td>'+nd(o.cfm,2)+'</td><td><span class="dot" style="background:var('+e.c+');margin:0 6px 0 0"></span>'+e.t+'</td></tr>'}).join("")+'</tbody></table></div>';
}
function tabOut(){

var MINI={Carga:["Distancia media por sesión, día a día","m"],Intensidad:["Distancia a alta intensidad por semana","m"],Movimiento:["Jugadores según su asimetría media","%"]};
function miniHost(id,h){return '<div class="kmini"><div class="cap">'+MINI[id][0]+'</div><div class="chart" data-mini="'+id+'" data-h="'+h+'"></div></div>'}
function drawMini(host){
  var id=host.dataset.mini,H=+host.dataset.h,f=state.tf,wk=f.week;
  var rc=tabRecs(true);
  mount(host,H,function(sv,W){
    var m={l:6,r:6,t:24,b:18},iw=W-m.l-m.r,ih=H-m.t-m.b,base=m.t+ih;
    sv.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:base,y2:base,stroke:cv("--grid")}));
    if(!rc.length){T(sv,W/2,H/2,"Sin datos con estos filtros");return}
    if(id==="Carga"){
      var by={};rc.forEach(function(x){if(x.r.dist!==null)(by[x.i]=by[x.i]||[]).push(x.r.dist)});
      var pts=[];for(var i=WARM;i<WARM+28;i++){if(by[i])pts.push({i:i,v:mean(by[i])})}
      var mn=Math.min.apply(null,pts.map(function(p){return p.v}))*.92,mx=Math.max.apply(null,pts.map(function(p){return p.v}))*1.04;
      var X=function(i){return m.l+(i-WARM)/27*iw},Y=function(v){return base-(v-mn)/(mx-mn)*ih};
      if(wk){sv.appendChild(el("rect",{x:X(WARM+(wk-1)*7)-iw/54,y:m.t-6,width:iw*7/27,height:ih+6,fill:cv("--band"),opacity:.8,rx:3}))}
      var d=pts.map(function(p,k){return (k?"L":"M")+X(p.i).toFixed(1)+" "+Y(p.v).toFixed(1)}).join("");
      sv.appendChild(el("path",{d:d+"L"+X(pts[pts.length-1].i).toFixed(1)+" "+base+"L"+X(pts[0].i).toFixed(1)+" "+base+"Z",fill:cv("--bar"),opacity:.35}));
      sv.appendChild(el("path",{d:d,fill:"none",stroke:cv("--ink-line"),"stroke-width":1.8,"stroke-linejoin":"round"}));
      pts.forEach(function(p,k){var last=k===pts.length-1;sv.appendChild(el("circle",{cx:X(p.i),cy:Y(p.v),r:last?4:6,fill:last?cv("--accent-d"):"transparent",stroke:last?cv("--panel"):"none","stroke-width":last?2:0,"data-tip":fmtD(p.i)+" · "+fmt(p.v)+" m por sesión"}))});
      for(var w=1;w<=4;w++)T(sv,X(WARM+(w-1)*7+3),H-4,"S"+w);
    }else if(id==="Intensidad"){
      var sums=[0,0,0,0];rc.forEach(function(x){sums[x.r.week-1]+=x.r.hi||0});
      var mx2=Math.max.apply(null,sums)*1.12,bw=iw/4;
      sums.forEach(function(v,k){var h=v/mx2*ih,x=m.l+k*bw,on=!wk||wk===k+1;
        sv.appendChild(el("rect",{"class":"bar",x:x+bw*.2,y:base-h,width:bw*.6,height:h,rx:3,fill:on?(wk?cv("--accent-d"):cv("--bar-hi")):cv("--bar"),opacity:on?1:.6,"data-tip":"Semana "+(k+1)+" · "+fmt(v)+" m a alta intensidad"}));
        T(sv,x+bw/2,base-h-4,v>=1000?(v/1000).toFixed(v>=10000?0:1)+"k":fmt(v));T(sv,x+bw/2,H-4,"S"+(k+1))});
    }else{
      var K=tabKpis(),vals=Object.keys(K.byPlayer).map(function(k){return mean(K.byPlayer[k])}),u=state.umbral;
      var top=Math.max(8,Math.ceil(Math.max(u,Math.max.apply(null,vals.concat([0])))+1)),nb=top,bins=[];for(var b=0;b<nb;b++)bins.push(0);
      vals.forEach(function(v){bins[Math.min(nb-1,Math.floor(v))]++});
      var mxc=Math.max.apply(null,bins.concat([1]))*1.15,bw2=iw/nb,Xu=m.l+u/nb*iw;
      bins.forEach(function(c,b){var h=c/mxc*ih,x=m.l+b*bw2;if(!c)return;
        sv.appendChild(el("rect",{"class":"bar",x:x+1.5,y:base-h,width:bw2-3,height:h,rx:2.5,fill:b>=u?cv("--accent-d"):cv("--bar-hi"),"data-tip":c+" jugador(es) con asimetría media de "+b+"–"+(b+1)+"%"}));
        T(sv,x+bw2/2,base-h-4,c)});
      for(var t=0;t<=nb;t+=2)T(sv,m.l+t/nb*iw,H-4,t+"%");
      sv.appendChild(el("line",{x1:Xu,x2:Xu,y1:14,y2:base,stroke:cv("--warn"),"stroke-width":1.6,"stroke-dasharray":"4 3"}));
      T(sv,Math.min(Xu+4,W-60),10,"umbral "+fmt(u,1)+"%","start",{style:"fill:var(--fg)"});
    }
  });
}

function tabCharts(id){

/* ---------- comparar jugadores ---------- */
function chartCmp(host,a,b,kind){
  var w=win(),n=w.to-w.from+1,m={l:44,r:12,t:8,b:26};
  mount(host,250,function(s,W,H){
    var iw=W-m.l-m.r,ih=H-m.t-m.b,mx=kind==="ac"?2:16,Y=function(v){return m.t+ih-Math.min(v,mx)/mx*ih};
    axisY(s,m.l,W-m.r,m.t,m.t+ih,0,mx,kind==="ac"?.5:4,function(v){return kind==="ac"?v.toFixed(1):v+"%"},true);
    if(kind==="ac")s.appendChild(el("rect",{x:m.l,y:Y(1.3),width:iw,height:Y(.8)-Y(1.3),fill:cv("--band"),opacity:.7}));
    else s.appendChild(el("line",{x1:m.l,x2:W-m.r,y1:Y(state.umbral),y2:Y(state.umbral),stroke:cv("--bad"),"stroke-dasharray":"6 4","stroke-width":1.4}));
    for(var i=w.from;i<=w.to;i++){var k=i-w.from;if(k%Math.ceil(n/Math.max(2,Math.floor(iw/72)))===0)T(s,m.l+(k+.5)*iw/n,H-6,fmtD(i))}
    [[a,"--accent-d",""],[b,"--ink-line","6 4"]].forEach(function(pb){var p=pb[0],d=[],pen=false;
      for(var i=w.from;i<=w.to;i++){var v=kind==="ac"?p.ac[i]:p.rec[i].asym,x=m.l+(i-w.from+.5)*iw/n;if(kind!=="ac"&&p.rec[i].rest)continue;if(v===null||v===undefined){pen=false;continue}
        d.push((pen?"L":"M")+x.toFixed(1)+" "+Y(v).toFixed(1));pen=true}
      s.appendChild(el("path",{d:d.join(""),fill:"none",stroke:cv(pb[1]),"stroke-width":2.2,"stroke-dasharray":pb[2],"stroke-linejoin":"round"}));
      for(i=w.from;i<=w.to;i++){v=kind==="ac"?p.ac[i]:p.rec[i].asym;if(v===null||v===undefined)continue;
        s.appendChild(el("circle",{cx:m.l+(i-w.from+.5)*iw/n,cy:Y(v),r:2.6,fill:cv(pb[1]),stroke:cv("--panel"),"stroke-width":1,"data-tip":p.name+" · "+fmtD(i)+" · "+(kind==="ac"?"ACWR "+v.toFixed(2):"Asimetría "+v.toFixed(1)+"%")}))}});
  });
}
function compareView(){
  var a=P[state.cmp[0]]||P[0],b=P[state.cmp[1]]||P[Math.min(1,P.length-1)];state.cmp=[a.id,b.id];
  var A=stats(a),B=stats(b),Ea=estado(a,A),Eb=estado(b,B);
  var opt=function(sel){return P.map(function(q){return '<option value="'+q.id+'"'+(q.id===sel?' selected':'')+'>#'+q.num+' · '+q.name+'</option>'}).join("")};
  var fm=function(v,d){return v===null||v===undefined?nd(v,d):fmt(v,d)};var row=function(l,x,y,d,lowGood){var df=x-y,sg=(df>=0?"+":"−")+Math.abs(df).toFixed(d);return '<tr><th scope="row" style="text-align:left;font-weight:400">'+l+'</th><td>'+fm(x,d)+'</td><td>'+fm(y,d)+'</td><td>'+sg+'</td></tr>'};
  var tb='<section class="panel c12"><div class="scroll"><table class="dtab"><thead><tr><th>Indicador del periodo</th><th>'+esc(a.name)+'</th><th>'+esc(b.name)+'</th><th>Diferencia</th></tr></thead><tbody>'+
   row("Distancia por sesión (m)",A.dist,B.dist,0)+row("Carga por minuto (m/min)",A.mpm,B.mpm,1)+row("Carga media (min)",A.load,B.load,0)+row("Velocidad máxima (km/h)",A.vmax,B.vmax,1)+row("ACWR actual",A.acwr,B.acwr,2)+
   '<tr><th scope="row" style="text-align:left;font-weight:400">Asimetría media (%)</th><td>'+nd(A.asym,1)+'</td><td>'+nd(B.asym,1)+'</td><td>'+(A.asym===null||B.asym===null?'<span class="nd">sin dato</span>':((A.asym-B.asym>=0?"+":"−")+Math.abs(A.asym-B.asym).toFixed(1)))+'</td></tr>'+
   '<tr><th scope="row" style="text-align:left;font-weight:400">Estado</th><td><span class="dot" style="background:var('+Ea.c+');margin:0 6px 0 0"></span>'+Ea.t+'</td><td><span class="dot" style="background:var('+Eb.c+');margin:0 6px 0 0"></span>'+Eb.t+'</td><td></td></tr></tbody></table></div></section>';
  var leg='<div class="legend"><span><i style="width:18px;height:2px;background:var(--accent-d)"></i>'+esc(a.name)+'</span><span><i style="width:18px;height:0;border-top:2px dashed var(--ink-line)"></i>'+esc(b.name)+'</span></div>';
  return '<div><h1 class="ptitle">Comparar jugadores</h1><p class="meta" style="margin:4px 0 0">Dos jugadores, mismo periodo y mismas definiciones</p></div>'+
   '<div class="fbar card"><div class="fld"><label for="cmpA">Jugador A (línea continua)</label><select id="cmpA" class="pill">'+opt(a.id)+'</select></div><div class="fld"><label for="cmpB">Jugador B (línea punteada)</label><select id="cmpB" class="pill">'+opt(b.id)+'</select></div></div>'+
   '<div class="grid">'+tb+'<section class="panel pc c6"><h2>ACWR en el periodo</h2>'+leg+'<div class="chart fill" id="c-cmp1" style="min-height:250px"></div></section>'+
   '<section class="panel pc c6"><h2>Asimetría de rodilla por día</h2>'+leg+'<div class="chart fill" id="c-cmp2" style="min-height:250px"></div></section></div>'+
   guide([["Tabla","mismos cálculos que Equipo y Vista de jugador; la diferencia es A menos B."],["ACWR","la franja verde (0.8–1.3) es el rango habitual; sobre 1.5 hay señal de revisión."],["Asimetría","la línea roja es el umbral configurado en el Tablero ("+fmt(state.umbral,1)+"%)."],["Cómo usarla","sirve para contrastar a dos jugadores de la misma posición o a un jugador con su referente."]],NOTE_ORIENTA);
}

/* ---------- animaciones ---------- */
var RMQ=window.matchMedia?matchMedia("(prefers-reduced-motion: reduce)"):{matches:false};
var EASE="cubic-bezier(.22,.61,.36,1)";
function animateChart(s,host){
  if(RMQ.matches||state.noAnim||!s.animate)return;
  var now=performance.now();if(!host._t0||now-host._t0>1200)host._t0=now;var el0=now-host._t0;
  var go=function(n,kf,dur,delay){try{var a=n.animate(kf,{duration:dur,delay:delay||0,easing:EASE,fill:"backwards"});a.currentTime=el0}catch(e){}};
  var bi=0;
  s.querySelectorAll("rect.bar").forEach(function(r){var hz=r.parentNode&&r.parentNode.tagName==="g";
    r.style.transformBox="fill-box";r.style.transformOrigin=hz?"left center":"center bottom";
    go(r,[{transform:hz?"scaleX(0)":"scaleY(0)",opacity:0},{transform:"none",opacity:1}],650,Math.min(bi++*16,380))});
  var li=0;
  s.querySelectorAll("path").forEach(function(p){var fl=p.getAttribute("fill"),st=p.getAttribute("stroke");
    if(fl&&fl!=="none"){go(p,[{opacity:0},{opacity:1}],700,120)}
    else if(st&&!p.getAttribute("stroke-dasharray")){p.setAttribute("pathLength","1");go(p,[{strokeDasharray:1,strokeDashoffset:1},{strokeDasharray:1,strokeDashoffset:0}],1000,(li++)*120)}
    else if(st){go(p,[{opacity:0},{opacity:1}],700,300)}});
  var ci=0;
  s.querySelectorAll("circle").forEach(function(c){c.style.transformBox="fill-box";c.style.transformOrigin="center";
    go(c,[{transform:"scale(0)",opacity:0},{transform:"none",opacity:1}],380,500+Math.min(ci++*10,420))});
  s.querySelectorAll("g.rowbtn text,text.lbl").forEach(function(t,i){go(t,[{opacity:0},{opacity:1}],500,Math.min(i*16,380))});
}
function countUp(root){
  if(RMQ.matches||state.noAnim)return;
  root.querySelectorAll(".kpis .card b,.kvv,.kval,.statuses .big,.kpi .big").forEach(function(e){
    var n=e.firstChild;if(!n||n.nodeType!==3)return;var m=n.nodeValue.match(/^(\s*[−+-]?)(\d[\d,]*)(\.(\d+))?/);if(!m)return;
    var dec=m[4]?m[4].length:0,to=parseFloat(m[2].replace(/,/g,"")+(m[3]||"")),rest=n.nodeValue.slice(m[0].length);
    if(!isFinite(to)||to===0)return;var t0=performance.now(),D=750;
    (function step(t){var k=Math.max(0,Math.min(1,(t-t0)/D)),v=to*(1-Math.pow(1-k,3));
      n.nodeValue=m[1]+v.toLocaleString("es-MX",{minimumFractionDigits:dec,maximumFractionDigits:dec})+rest;
      if(k<1&&n.parentNode)requestAnimationFrame(step)})(t0)})}
function enter(v,changed){
  if(RMQ.matches||state.noAnim)return;
  if(changed){[].forEach.call(v.children,function(c,i){c.style.setProperty("--i",Math.min(i,8))});v.classList.remove("enter");void v.offsetWidth;v.classList.add("enter")}
  countUp(v)}
